<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Calculadora de IMC</h1>

    <div class="space-y-4">
      <input type="number" placeholder="Peso (kg)" [(ngModel)]="peso"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">

      <input type="number" placeholder="Altura (m)" [(ngModel)]="altura"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">

      <button (click)="calcularIMC()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200 shadow-md">
        Calcular
      </button>
    </div>

    <div *ngIf="resultado" class="mt-6 p-4 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg animate-fade-in">
      <p class="text-gray-700 font-medium">
        Seu IMC é: <span class="text-blue-700 font-bold text-xl">{{ resultado | number:'1.1-2' }}</span>
      </p>

      <p class="mt-1 text-sm text-gray-600 uppercase tracking-wide">
        Situação: <span class="font-bold">{{ classificacao }}</span>
      </p>
    </div>
  </div>
</div>
